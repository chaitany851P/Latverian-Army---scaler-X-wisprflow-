name: CI

on:
  pull_request:
    branches: [main, integration]
  push:
    branches: [main, integration, "chore/*", "feature/*", "fix/*", "test/*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and API tests
        run: npm test

      - name: Build all workspaces
        run: npm run build

      - name: Validate Docker Compose syntax
        run: |
          docker compose -f docker-compose.yml config --quiet
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci POSTGRES_DB=ci APP_ORIGIN=https://example.com SITE_DOMAIN=example.com docker compose -f docker-compose.prod.yml config --quiet
